services:
  comfy:
    build: .
    container_name: comfyui
    user: "${UID}:${GID}"
    shm_size: "${COMFY_SHM_SIZE:-16g}"
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "${COMFY_HOST_BIND:-127.0.0.1}:${COMFY_PORT:-8188}:${COMFY_PORT:-8188}"
    volumes:
#     inner data, be careful not to wipe it with git clean. but it is not very important and can be reinited
      - ./venv:/workspace/venv
      - ./pip_cache:/workspace/pip_cache
      - ./hf_cache:/workspace/cache/huggingface
      - ./ultralytics_cache:/workspace/cache/ultralytics
      - ./asset-profiles.json:/workspace/asset-profiles.json:ro
      - ./ComfyUI:/workspace/ComfyUI
      - ./custom_nodes:/workspace/ComfyUI/custom_nodes
      - ./SelfBuiltWheels:/workspace/SelfBuiltWheels
      - ./constraints.txt:/workspace/constraints.txt:ro

#     comfy user data: models, templates, input and output. stored separately to protect from accidental deletion
      - ../ComfyData/models:/workspace/ComfyUI/models
      - ../ComfyData/user:/workspace/ComfyUI/user
      - ../ComfyData/input:/workspace/ComfyUI/input
      - ../ComfyData/output:/workspace/ComfyUI/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      CUDA_CACHE_MAXSIZE: "4294967296"
      NCCL_P2P_DISABLE: "1"
      HF_HOME: /workspace/cache/huggingface
      PIP_CACHE_DIR: /workspace/pip_cache
      PIP_CONSTRAINT: /workspace/constraints.txt
      YOLO_CONFIG_DIR: /workspace/cache/ultralytics
      COMFY_ASSET_PROFILES: ${COMFY_ASSET_PROFILES:-}
      COMFY_CUSTOM_NODE_EXAMPLE_WORKFLOWS_ENABLED: ${COMFY_CUSTOM_NODE_EXAMPLE_WORKFLOWS_ENABLED:-true}
      COMFY_CUSTOM_NODE_EXAMPLE_WORKFLOWS_ALLOWLIST: ${COMFY_CUSTOM_NODE_EXAMPLE_WORKFLOWS_ALLOWLIST:-ComfyUI-WanVideoWrapper,ComfyUI-KJNodes,ComfyUI-WanAnimatePreprocess,ComfyUI-qwenmultiangle,ComfyUI-DGX-Spark-Templates}
      COMFY_PORT: ${COMFY_PORT:-8188}
      COMFY_CMDLINE_EXTRA: ${COMFY_CMDLINE_EXTRA:---bf16-unet --bf16-vae --bf16-text-enc --use-sage-attention}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:${COMFY_PORT:-8188}/ >/dev/null || pgrep -af 'curl .* /workspace/ComfyUI/models/.*\\.part|wget .* /workspace/ComfyUI/models/' >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
    env_file:
      - .env
    working_dir: /workspace
    tty: true
    stdin_open: true
